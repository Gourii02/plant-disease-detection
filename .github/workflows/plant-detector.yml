# ════════════════════════════════════════════════════════════════════════════
# .github/workflows/plant-detector.yml
# ════════════════════════════════════════════════════════════════════════════
#
# CONCEPT: What is GitHub Actions?
#   GitHub Actions is a built-in automation system inside GitHub.
#   You write a "workflow" file (this YAML file) that describes a recipe:
#   "when X happens, do Y, then Z".
#
#   GitHub runs your recipe on free virtual machines called "runners"
#   (think: a fresh Ubuntu laptop in the cloud that GitHub lends you).
#   These runners run your steps, report success/failure, and then vanish.
#
# CONCEPT: What is a YAML file?
#   YAML is a format for writing structured data using indentation.
#   Two spaces = one level of nesting. Colons separate keys from values.
#   Lines starting with # are comments (ignored by the runner).
#
# CONCEPT: What is GHCR?
#   GitHub Container Registry — a place to store Docker images, hosted by
#   GitHub. Free for public repositories. Tightly integrated with your
#   GitHub account (same username, same tokens).
#   Images live at: ghcr.io/<github-username>/<image-name>
#
# WHAT THIS FILE DOES:
#   On every push or pull request to `main`:
#     Job 1 (test): Install deps → lint with ruff → run pytest
#     Job 2 (build-and-push): ONLY if Job 1 passed AND we're on main branch:
#       Build the Docker image → push it to GHCR
# ════════════════════════════════════════════════════════════════════════════


# The name shown in the GitHub "Actions" tab for this workflow
name: Plant Detector CI/CD


# ── TRIGGERS ────────────────────────────────────────────────────────────────
# `on:` defines WHEN this workflow runs.
#
# push → branches: [main]
#   Runs whenever you push commits directly to the main branch.
#
# pull_request → branches: [main]
#   Runs whenever you open or update a pull request targeting main.
#   This lets you check that a branch passes tests BEFORE merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# ── JOBS ─────────────────────────────────────────────────────────────────────
# `jobs:` is a list of independent (or ordered) groups of steps.
# By default, jobs run in parallel. We use `needs:` to enforce order.
jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1: test
  # Runs on every push AND every pull request (before merging).
  # Never skipped — tests are always the gate.
  # ══════════════════════════════════════════════════════════════════════════
  test:
    # `runs-on:` picks the type of runner machine GitHub provides for free.
    # ubuntu-latest = the most recent stable Ubuntu LTS. 2-core CPU, 7GB RAM.
    runs-on: ubuntu-latest

    # `steps:` is the ordered list of commands this job runs.
    steps:

      # ── Step 1: Check out the code ──────────────────────────────────────
      # `uses:` runs a pre-built Action (reusable script) from GitHub's marketplace.
      # actions/checkout@v4 downloads your repository files onto the runner.
      # Without this, the runner starts with an empty disk — no code at all.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Install Python 3.11 ─────────────────────────────────────
      # actions/setup-python@v5 installs Python on the runner and adds it to PATH.
      #
      # cache: "pip"
      #   GitHub caches pip's downloaded package files between runs.
      #   If requirements.txt hasn't changed, packages are restored from cache
      #   instead of re-downloading from PyPI. Saves ~2–3 minutes per run.
      #
      # cache-dependency-path: tells the cache which file to watch.
      #   If this file changes, the cache is invalidated and packages re-download.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      # ── Step 3: Install Python dependencies ──────────────────────────────
      # `run:` executes a shell command on the runner.
      # This installs fastapi, pytest, ruff, transformers, torch, etc.
      #
      # NOTE: We use requirements.txt (not requirements.docker.txt) here.
      # The runner DOES need pytest and ruff (excluded from Docker image).
      # The runner downloads full torch (~800MB). GitHub's cache makes this
      # fast after the first run.
      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # ── Step 4: Lint with ruff ────────────────────────────────────────────
      # ruff is an extremely fast Python linter (written in Rust).
      # It checks for syntax errors, undefined names, unused imports, etc.
      # --select E,F = check "pycodestyle errors" and "pyflakes" rules
      # If any lint error is found, ruff exits with code 1 → job fails → PR blocked.
      - name: Lint with ruff
        run: ruff check backend/app/ backend/tests/ --select E,F --ignore E501

      # ── Step 5: Run pytest ────────────────────────────────────────────────
      # Runs all tests in backend/tests/.
      #
      # IMPORTANT: The tests mock the HuggingFace model (via unittest.mock.patch)
      # so the runner does NOT download the 14MB model or need a GPU.
      # The mock returns a fake prediction — we test our logic, not the model.
      #
      # `working-directory:` changes the shell's current directory for this step.
      # We need this because our app imports `from app.main import app` —
      # Python needs to find the `app` package, which is at backend/app/.
      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v


  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2: build-and-push
  # Builds the Docker image and pushes it to GHCR.
  #
  # ONLY runs when:
  #   (a) Job 1 (test) succeeded — `needs: test`
  #   (b) This is a push to main (not a pull request) — `if:` condition
  #
  # We skip this on pull requests because:
  #   - PRs might come from forks (security risk with secrets)
  #   - We only want to ship a new image from tested, merged code
  # ══════════════════════════════════════════════════════════════════════════
  build-and-push:
    # This job waits for the `test` job to complete before it starts.
    # If `test` fails, this job is automatically skipped.
    needs: test

    # `if:` is a conditional expression. This job only runs on pushes to main.
    # `github.ref`        = the full git ref of the event (e.g. "refs/heads/main")
    # `github.event_name` = "push" for pushes, "pull_request" for PRs
    # Both conditions must be true (&&).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    # ── Permissions ────────────────────────────────────────────────────────
    # By default, jobs have read-only access to the repo.
    # `packages: write` grants permission to push Docker images to GHCR.
    # `contents: read` grants permission to checkout the code (good practice
    # to be explicit rather than relying on defaults).
    permissions:
      contents: read
      packages: write

    steps:

      # ── Step 1: Check out the code ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Docker Buildx ─────────────────────────────────────
      # docker/build-push-action@v5 requires Buildx (Docker's extended builder).
      # Without this step the action fails immediately with a cryptic error.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Step 3: Lowercase the repository owner ───────────────────────────
      # GHCR requires image names to be ALL LOWERCASE.
      # github.repository_owner may be mixed-case (e.g. "Gourii02").
      # This step converts it and stores the result in the OWNER env variable,
      # which we read in the build step below as ${{ env.OWNER }}.
      - name: Convert owner to lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # ── Step 4: Log in to GitHub Container Registry ─────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 5: Build and push the Docker image ──────────────────────────
      # context: ./backend → Dockerfile lives inside backend/
      # push: true         → push to GHCR after building
      # tags               → full image name using the lowercase owner
      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ env.OWNER }}/plant-detector-backend:latest
